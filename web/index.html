<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Muslingo — персональный AI-тренер по Корану, арабскому языку и основам ислама. Учись каждый день короткими интерактивными уроками.">
  <meta name="theme-color" content="#155B88">
  <meta property="og:title" content="Muslingo — учи Коран каждый день">
  <meta property="og:description" content="Персональный AI-тренер по Корану, арабскому языку и основам ислама в формате коротких интерактивных уроков.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muslingo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Muslingo — учи Коран каждый день</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Брендовый лоадер: виден до загрузки Flutter web, скрывается на первом кадре */
    #muslingo-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #155B88;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      opacity: 1;
      transition: opacity 0.4s ease;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #muslingo-splash.muslingo-splash--hidden {
      opacity: 0;
      pointer-events: none;
    }
    #muslingo-splash .muslingo-splash__logo {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }
    #muslingo-splash .muslingo-splash__title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    #muslingo-splash .muslingo-splash__subtitle {
      font-size: 15px;
      font-weight: 400;
      opacity: 0.85;
    }
    #muslingo-splash .muslingo-splash__spinner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #FFFFFF;
      animation: muslingo-spin 0.9s linear infinite;
    }
    @keyframes muslingo-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #muslingo-splash .muslingo-splash__spinner { animation-duration: 2s; }
    }
  </style>
  <script>
    (() => {
      let installPrompt = null;

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        installPrompt = event;
        window.dispatchEvent(new CustomEvent('muslingo-install-ready'));
      });

      window.addEventListener('appinstalled', () => {
        installPrompt = null;
        window.dispatchEvent(new CustomEvent('muslingo-installed'));
      });

      window.muslingoIsInstalled = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      window.muslingoCanInstall = () => installPrompt !== null;

      window.muslingoNeedsIosInstallInstructions = () => {
        const agent = window.navigator.userAgent.toLowerCase();
        const ios = /iphone|ipad|ipod/.test(agent);
        return ios && !window.muslingoIsInstalled();
      };

      window.muslingoInstall = async () => {
        if (window.muslingoIsInstalled()) return 'accepted';
        if (window.muslingoNeedsIosInstallInstructions()) {
          return 'ios-instructions';
        }
        if (!installPrompt) return 'unavailable';
        installPrompt.prompt();
        const choice = await installPrompt.userChoice;
        installPrompt = null;
        return choice.outcome;
      };
    })();

    (() => {
      const pushWorkerUrl = '/push/muslingo_push_sw.js';
      const pushScope = '/push/';

      const applicationServerKey = (value) => {
        const padding = '='.repeat((4 - value.length % 4) % 4);
        const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(base64);
        return Uint8Array.from([...raw].map((character) => character.charCodeAt(0)));
      };

      const installationId = () => {
        const key = 'muslingo_push_installation_id';
        let value = localStorage.getItem(key);
        if (!value) {
          value = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
          localStorage.setItem(key, value);
        }
        return value;
      };

      const registration = () =>
        navigator.serviceWorker.register(pushWorkerUrl, { scope: pushScope });

      window.muslingoPush = {
        isSupported: () =>
          window.isSecureContext &&
          'serviceWorker' in navigator &&
          'PushManager' in window &&
          'Notification' in window,

        subscribe: async (hour, minute, dueCount, learningGoal, authToken) => {
          try {
            if (!window.muslingoPush.isSupported() || Notification.permission !== 'granted') {
              return false;
            }
            const worker = await registration();
            let subscription = await worker.pushManager.getSubscription();
            if (!subscription) {
              const keyResponse = await fetch('/api/push/public-key', {
                headers: { Accept: 'application/json' },
              });
              if (!keyResponse.ok) return false;
              const { publicKey } = await keyResponse.json();
              subscription = await worker.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: applicationServerKey(publicKey),
              });
            }
            const response = await fetch('/api/push/subscribe', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Accept: 'application/json',
                ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}),
              },
              body: JSON.stringify({
                subscription: subscription.toJSON(),
                installationId: installationId(),
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
                hour,
                minute,
                dueCount,
                learningGoal: learningGoal || null,
              }),
            });
            return response.ok;
          } catch (error) {
            console.warn('Muslingo push subscription failed', error);
            return false;
          }
        },

        unsubscribe: async (authToken) => {
          try {
            if (!window.muslingoPush.isSupported()) return false;
            const worker = await registration();
            const subscription = await worker.pushManager.getSubscription();
            if (!subscription) return true;
            await fetch('/api/push/unsubscribe', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Accept: 'application/json',
                ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}),
              },
              // installationId обязателен: сервер по нему подтверждает, что
              // отписывается владелец подписки, а не случайный знающий endpoint.
              body: JSON.stringify({
                endpoint: subscription.endpoint,
                installationId: installationId(),
              }),
            });
            return subscription.unsubscribe();
          } catch (error) {
            console.warn('Muslingo push unsubscribe failed', error);
            return false;
          }
        },

        showTest: async (title, body) => {
          try {
            if (!window.muslingoPush.isSupported() || Notification.permission !== 'granted') {
              return false;
            }
            const worker = await registration();
            await worker.showNotification(title, {
              body,
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
              tag: 'muslingo-test-reminder',
              data: { url: '/#/home' },
            });
            return true;
          } catch (error) {
            console.warn('Muslingo test notification failed', error);
            return false;
          }
        },
      };
    })();
  </script>
</head>
<body>
  <!-- Брендовый экран загрузки: перекрывается Flutter при старте, не мешает bootstrap -->
  <div id="muslingo-splash" role="status" aria-live="polite" aria-label="Загрузка Muslingo">
    <img class="muslingo-splash__logo" src="icons/Icon-192.png" alt="Muslingo" />
    <div class="muslingo-splash__title">Muslingo</div>
    <div class="muslingo-splash__subtitle">учи Коран каждый день</div>
    <div class="muslingo-splash__spinner"></div>
  </div>
  <script>
    // Скрываем брендовый лоадер, когда Flutter отрисовал первый кадр.
    (() => {
      let removed = false;
      const removeSplash = () => {
        if (removed) return;
        removed = true;
        const splash = document.getElementById('muslingo-splash');
        if (!splash) return;
        splash.classList.add('muslingo-splash--hidden');
        // Удаляем узел после завершения плавного исчезновения.
        window.setTimeout(() => splash.remove(), 500);
      };
      // Flutter web диспатчит событие первого кадра; слушаем на window и document.
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
      document.addEventListener('flutter-first-frame', removeSplash, { once: true });
      // Страховка: если событие не пришло, всё равно убираем лоадер.
      window.setTimeout(removeSplash, 12000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
