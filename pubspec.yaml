name: muslingo
description: Muslingo — игровое изучение Корана, арабского языка и основ ислама.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.9.3
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  just_audio: ^0.10.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Нативные иконки приложения (Android mipmap + adaptive, iOS AppIcon) из бренда.
# Генерация: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "web/icons/Icon-512.png"
  android: "ic_launcher"
  min_sdk_android: 21
  remove_alpha_ios: true
  ios: true
  # Adaptive: сплошной брендовый фон + маскот с безопасными полями (не срежется
  # при круглой/квадратной обрезке лаунчера).
  adaptive_icon_background: "#155B88"
  adaptive_icon_foreground: "web/icons/Icon-maskable-512.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
