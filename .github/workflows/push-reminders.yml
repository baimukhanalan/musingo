name: Muslingo push reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: muslingo-push-reminders
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=muslingo-cron")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Deliver due reminders
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            https://muslingo-mobile.vercel.app/api/cron/reminders
