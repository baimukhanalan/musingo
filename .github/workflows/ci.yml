name: CI

# Раньше в репозитории не было ни одного workflow, запускающего тесты:
# единственный существующий (push-reminders.yml) — это прод-доставка
# уведомлений по cron, и на изменения кода он не реагирует.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # --no-fatal-infos: info-замечания (например депрекейшены в SDK
      # зависимостей) не должны валить сборку — падаем только на warning/error.
      - name: Анализатор
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test

  api:
    name: Тесты серверной части
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # В репозитории pnpm-lock.yaml, package-lock.json нет — ставим pnpm,
      # иначе CI разошёлся бы с локальной установкой.
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      # Заодно проверяем, что лок-файл согласован с package.json.
      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Тесты
        run: pnpm run test:api
